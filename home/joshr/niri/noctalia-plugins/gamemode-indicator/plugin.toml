id = "joshr/gamemode-indicator"
name = "GameMode indicator"
description = "Shows a bar glyph while the session is in GameMode"
version = "2.0.0"
author = "joshr"

# The oldest plugin API level this needs, which is the floor: the widget only
# uses setGlyph/setGlyphColor/setTooltip/setVisible, runAsync with a callback
# and setUpdateInterval, all of which predate every numbered level.
#
# It is not a "which noctalia is this" field. It used to say 19 — the level
# that happens to ship with the packaged v5.0.0-beta.7 — and the registry
# compares it against `kOldestSupportedPluginApiVersion`..`kCurrentPluginApiVersion`
# and drops anything outside that window with a log line and no widget. Naming
# a level higher than the plugin uses only buys a version of this indicator
# that stops existing the moment nixpkgs is behind noctalia's tip.
plugin_api = 3

# Nothing to install: the status command is baked into widget.luau as an
# absolute store path by home/joshr/niri/noctalia.nix. The major here went to 2
# when that command changed from `gamemode-status` — "is a game holding
# gamemode" — to `niri-gamemode status`, which answers for the session's whole
# GameMode and distinguishes the two ways into it.
dependencies = []

[[widget]]
id = "status"
entry = "widget.luau"
